name: pulso
description: App pessoal de lembretes, objectivos e educação financeira.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Base de dados local
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # Notificações locais
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0
  
  # State management
  flutter_riverpod: ^2.6.1
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.0

flutter:
  uses-material-design: true