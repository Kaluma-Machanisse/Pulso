name: pulso
description: App pessoal de lembretes, objectivos e educação financeira.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Base de dados local
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0
  
  # Notificações locais
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.0
  
  # State management
  flutter_riverpod: ^2.6.1
  
  # UI
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  telephony: ^0.2.0
  fl_chart: ^1.2.0
  supabase_flutter: ^2.12.4
  shared_preferences: ^2.5.5

  # Relatórios em PDF
  pdf: ^3.11.1
  printing: ^5.13.4
  notification_listener_service: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.2

# Ecrã de arranque nativo (elimina o flash branco antes do Flutter carregar).
# Regenerar:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F7F8FA"
  color_dark: "#0F1115"
  android_12:
    color: "#F7F8FA"
    color_dark: "#0F1115"
  android: true
  ios: true

# Ícone da app.  Regenerar:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#15171C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  fonts:
    # Texto da app
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk.ttf
          weight: 700
    # Wordmark / logótipo
    - family: FamiljenGrotesk
      fonts:
        - asset: assets/fonts/FamiljenGrotesk.ttf
        - asset: assets/fonts/FamiljenGrotesk.ttf
          weight: 500
        - asset: assets/fonts/FamiljenGrotesk.ttf
          weight: 700